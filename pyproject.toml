[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "arcana-map-studio"
version = "0.9.1"
description = "Open-source map editor and ROM analysis tools for Arcana USA on SNES"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Arcana Map Studio contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
]

[project.scripts]
arcana-map-studio = "arcana_editor.app:main"
arcana-extract = "arcana_editor.extract:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
